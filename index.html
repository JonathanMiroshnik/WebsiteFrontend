<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensor? Censor!</title>
    <link rel="canonical" href="https://www.sensorcensor.xyz" />
    <link rel="icon" type="image/png" href="assets/favicon.ico" sizes="32x32" />
    <meta name="description" content="Sensor Censor" />

    <!-- Bootstrap CSS -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->

    <!-- Preconnect to CDNs for faster resource loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://code.iconify.design">

    <!-- HTMX for dynamic content loading -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.6/dist/htmx.min.js"></script>

    <!-- Allow cross-origin requests to the backend API -->
    <script>
      htmx.config.selfRequestsOnly = false;
    </script>

    <!-- Iconify for icons -->
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

    <!-- Custom CSS -->
    <link href="/css/index.css" rel="stylesheet" />
    <link href="/css/navbar.css" rel="stylesheet" />
    <link href="/css/home.css" rel="stylesheet" />
    <link href="/css/blog.css" rel="stylesheet" />
    <link href="/css/projects.css" rel="stylesheet" />
    <link href="/css/footer.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <div class="layout-navbar">
      <nav class="website-navbar">
        <span
          class="iconify"
          data-icon="solar:armchair-outline"
          data-width="24"
          data-height="24"
        ></span>

        <a hx-get="/html/home" hx-target="#content" hx-push-url="/" hx-indicator="#loading-bar"
          ><button class="navbar">Home</button></a
        >
        <a hx-get="/html/blog" hx-target="#content" hx-push-url="/blog" hx-indicator="#loading-bar"
          ><button class="navbar">Blog</button></a
        >
        <a hx-get="/html/projects" hx-target="#content" hx-push-url="/projects" hx-indicator="#loading-bar"
          ><button class="navbar">Projects</button></a
        >
        <!-- Playground disabled
        <a hx-get="/html/playground.html" hx-target="#content" hx-push-url="/playground"
          ><button class="navbar">Playground</button></a
        >
        -->
      </nav>
    </div>

    <!-- Main Content Area -->
    <main class="layout-main htmx-loading-container">
      <div id="loading-bar" class="htmx-indicator htmx-loading-bar"></div>
      <div id="content" hx-swap="innerHTML">
        <!-- Home page content (inlined to avoid double-load on initial visit) -->
        <div class="content-container h-card">
          <div class="home-page-content">
            <div class="home-flex-container">
              <div class="home-text-section fade-in-up">
                <div class="home-text-wrapper">
                  <h1 class="home-title">Jonathan Miroshnik</h1>
                  <div class="home-subtitle-container">
                    <div class="home-accent-bar"></div>
                    <h2 class="home-subtitle">Programmer & Developer</h2>
                  </div>
                </div>
              </div>
              <div class="home-image-section fade-in-up-delayed">
                <picture>
                  <source srcset="../assets/mikudisreactsmall.webp" type="image/webp">
                  <img
                    src="../assets/mikudisreactsmall.png"
                    alt="Profile"
                    class="home-profile-image u-photo"
                    loading="lazy"
                  />
                </picture>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer/Contact Bar (inlined to avoid extra HTTP request) -->
    <div class="layout-footer">
      <footer class="contact-bar">
        <div class="contact-left">
          <p>
            <span
              class="iconify"
              data-icon="solar:mailbox-linear"
              data-width="24"
              data-height="24"
            ></span>
            <a href="mailto:jonathanmiroshnik@gmail.com" rel="me">jonathanmiroshnik@gmail.com</a>
          </p>
          <p>
            <span
              class="iconify"
              data-icon="solar:people-nearby-linear"
              data-width="24"
              data-height="24"
            ></span>
            <a
              href="https://www.linkedin.com/in/jonathan-miroshnik-711b52334/"
              rel="noopener noreferrer me"
              target="_blank"
              >My LinkedIn</a
            >
          </p>
          <p>
            <span
              class="iconify"
              data-icon="octicon:mark-github-16"
              data-width="24"
              data-height="24"
            ></span>
            <a href="https://github.com/JonathanMiroshnik" rel="me">My GitHub</a>
          </p>
          <p>
            <span
              class="iconify"
              data-icon="solar:document-text-linear"
              data-width="24"
              data-height="24"
            ></span>
            <a href="/assets/media/text/JonathanMiroshnik.pdf" download="JonathanMiroshnik.pdf"
              >View My CV</a
            >
          </p>
        </div>
      </footer>
    </div>

    <!-- Custom JavaScript for navigation (loaded at end of body so DOM is ready) -->
    <script src="/js/navigation.js"></script>
  </body>
</html>
